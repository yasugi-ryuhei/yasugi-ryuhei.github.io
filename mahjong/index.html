<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>麻雀ドリル｜点数計算の練習・待ち牌チェック・点数早見表（無料）</title>
  <meta name="description" content="麻雀の待ち牌と何切るのチェック、点数計算機、点数早見表、役一覧、点数計算の練習が無料で使えます。赤ドラの枚数や三人麻雀など、自分のルールに合わせて設定できます。登録は不要です。">
  <meta property="og:title" content="麻雀ドリル｜点数計算の練習・待ち牌チェック・点数早見表">
  <meta property="og:description" content="点数計算の練習、待ち牌と何切るのチェック、点数早見表。自分のルールに合わせて使えます。">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <span class="logo">麻雀ドリル</span>
      <nav class="tabs" role="tablist" aria-label="機能">
        <button type="button" role="tab" id="tab-yaku" data-view="yaku">役一覧</button>
        <button type="button" role="tab" id="tab-table" data-view="table">点数表</button>
        <button type="button" role="tab" id="tab-calc" data-view="calc">計算機</button>
        <button type="button" role="tab" id="tab-machi" data-view="machi">待ち牌</button>
        <button type="button" role="tab" id="tab-practice" data-view="practice">練習</button>
        <button type="button" role="tab" id="tab-rules" data-view="rules">設定</button>
      </nav>
    </div>
  </header>

  <main class="inner">
    <!-- 練習 -->
    <section id="view-practice" hidden>
      <div id="home">
        <h1>点数計算の練習</h1>
        <div class="modes">
          <button type="button" class="mode" data-start="table">
            <span class="mode-art"><b>30</b>符<b>3</b>翻</span>
            <span class="mode-text"><strong>翻と符から</strong><small id="stat-table"></small></span>
          </button>
          <button type="button" class="mode" data-start="hand">
            <span class="mode-art tiles-art" id="art-hand"></span>
            <span class="mode-text"><strong>手牌から</strong><small id="stat-hand"></small></span>
          </button>
        </div>
        <button type="button" class="rule-bar" data-view="rules"><span id="rule-summary"></span><i>変更</i></button>
      </div>

      <div id="quiz" hidden>
        <div class="quiz-head">
          <button type="button" class="link-button" data-home>← 戻る</button>
          <p id="progress" aria-live="polite"></p>
        </div>
        <div class="card">
          <div id="question"></div>
          <div id="options" class="options"></div>
          <div id="result" aria-live="polite" hidden></div>
        </div>
      </div>
    </section>

    <!-- 待ち牌 -->
    <section id="view-machi" hidden>
      <h1>待ち牌チェック</h1>
      <div class="card">
        <div class="machi-top"><span id="machi-count"></span><button type="button" class="link-button" id="machi-clear">全部消す</button></div>
        <div class="hand machi-hand" id="machi-hand"></div>
      </div>
      <div class="palette" id="palette"></div>
      <div class="card" id="machi-result" aria-live="polite"></div>
      <p class="note">13枚で待ち、14枚で何を切るかが出ます。鳴いた面子は入れずに、残りの手牌だけ入れてください。</p>
    </section>

    <!-- 点数計算機 -->
    <section id="view-calc" hidden>
      <h1>点数計算機</h1>
      <div class="card">
        <div class="machi-top"><span id="calc-count"></span><button type="button" class="link-button" id="calc-clear">全部消す</button></div>
        <div class="hand machi-hand" id="calc-hand"></div>
        <div class="melds" id="calc-melds" hidden></div>
      </div>
      <div class="seg wide mode-seg" id="calc-mode"></div>
      <div class="palette" id="calc-palette"></div>
      <div class="card calc-opts" id="calc-opts"></div>
      <div class="card" id="calc-result" aria-live="polite"></div>
      <p class="note">最後に入れた牌が和了牌になります。鳴きは「ポン」などを選んでから牌をタップ（チーは一番小さい牌）。</p>
    </section>

    <!-- 早見表 -->
    <section id="view-table" hidden>
      <h1>点数早見表</h1>
      <div class="seg wide">
        <button type="button" id="table-child" data-side="child" aria-pressed="true">子</button>
        <button type="button" id="table-dealer" data-side="dealer" aria-pressed="false">親</button>
      </div>
      <p class="note">上がロン、下がツモ。<span id="table-rule"></span></p>
      <div id="table-body"></div>
    </section>

    <!-- 役一覧 -->
    <section id="view-yaku">
      <h1>役一覧</h1>
      <div class="seg wide" id="yaku-jump"></div>
      <div id="yaku-body"></div>
    </section>

    <!-- 設定 -->
    <section id="view-rules" hidden>
      <h1>ルール設定</h1>
      <p class="note">わからなければ「四人麻雀」のままで大丈夫です。もっとも一般的なルールになっています。</p>
      <div class="seg wide">
        <button type="button" id="preset-standard" data-preset="standard">四人麻雀</button>
        <button type="button" id="preset-sanma" data-preset="sanma">三人麻雀</button>
      </div>
      <div class="card" id="rule-items"></div>
    </section>
  </main>

  <footer class="site-footer"><div class="inner">© 麻雀ドリル</div></footer>

  <script src="js/engine.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/shanten.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/yaku.js"></script>
  <script src="js/app.js"></script>
  <script>
    // モード選択の絵
    document.getElementById('art-hand').innerHTML = [12, 13, 14, 32, 32].map(function (t) { return MJTiles.tileSVG(t); }).join('');
  </script>
</body>
</html>
