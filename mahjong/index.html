<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>麻雀の点数計算 練習問題（無料）｜麻雀ドリル</title>
  <meta name="description" content="麻雀の点数計算を無料で練習できるサイトです。翻と符から点数を答える問題と、手牌から役・符・点数を答える実戦問題を、解説つきで何問でも解けます。登録は不要です。">
  <meta property="og:title" content="麻雀の点数計算 練習問題（無料）｜麻雀ドリル">
  <meta property="og:description" content="翻と符の早見問題と、手牌からの実戦問題。役と符の内訳つきで何問でも練習できます。">
  <meta property="og:type" content="website">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="./">麻雀ドリル</a>
      <nav><a href="score-table.html">点数早見表</a></nav>
    </div>
  </header>

  <main class="inner">
    <section id="home">
      <h1>麻雀の点数計算を練習する</h1>
      <p class="lead">問題は毎回自動で作られるので、何問でも無料で解けます。登録は不要で、成績はこの端末に保存されます。</p>
      <div class="modes">
        <button type="button" class="mode" data-start="table">
          <span class="level">はじめての人</span>
          <strong>翻と符から点数</strong>
          <p>「子・ロン・30符3翻」のような条件から点数を答えます。点数表を覚える練習です。</p>
          <small id="stat-table"></small>
        </button>
        <button type="button" class="mode" data-start="hand">
          <span class="level">実戦向け</span>
          <strong>手牌から点数</strong>
          <p>和了した手牌を見て、役と符を数えて点数を答えます。役と符の内訳つきで解説します。</p>
          <small id="stat-hand"></small>
        </button>
      </div>

      <h2>点数計算の流れ</h2>
      <p>点数は「翻」と「符」の2つで決まります。翻は役とドラの数、符は和了の形や待ち方でつく点です。まず翻を数え、4翻以下なら符も数えて、<a href="score-table.html">点数早見表</a>に当てはめます。5翻以上は符に関係なく満貫以上になります。</p>
      <h2>このサイトのルール</h2>
      <p class="note">喰いタンあり、赤ドラなし、切り上げ満貫なし、連風牌の雀頭は4符で出題しています。一発と裏ドラは出題しません。</p>
    </section>

    <section id="quiz" hidden>
      <div class="quiz-head">
        <h1 id="quiz-title"></h1>
        <button type="button" class="link-button" data-home>モード選択に戻る</button>
      </div>
      <p id="progress" aria-live="polite"></p>
      <div class="card">
        <div id="question"></div>
        <div id="options" class="options"></div>
        <div id="result" aria-live="polite" hidden></div>
      </div>
    </section>
  </main>

  <footer class="site-footer"><div class="inner">© 麻雀ドリル</div></footer>

  <script src="js/engine.js"></script>
  <script src="js/generator.js"></script>
  <script src="js/tiles.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
