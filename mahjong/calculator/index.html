<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>麻雀の点数計算機｜手牌を入れて役・符・点数を自動計算｜麻雀ドリル</title>
  <meta name="description" content="手牌と鳴き、リーチやドラを入れるだけで、役・符・点数を自動で計算します。三人麻雀や赤ドラなどのルール設定にも対応。">
  <link rel="canonical" href="https://yasugi-ryuhei.github.io/mahjong/calculator/">
  <meta property="og:title" content="麻雀の点数計算機｜手牌を入れて役・符・点数を自動計算｜麻雀ドリル">
  <meta property="og:description" content="手牌と鳴き、リーチやドラを入れるだけで、役・符・点数を自動で計算します。三人麻雀や赤ドラなどのルール設定にも対応。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yasugi-ryuhei.github.io/mahjong/calculator/">
  <meta property="og:site_name" content="麻雀ドリル">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-view="calc">
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="../">麻雀ドリル</a>
      <nav class="tabs" aria-label="機能">
        <a href="../">役一覧</a>
        <a href="../score-table/">点数表</a>
        <a href="../calculator/" aria-current="page">計算機</a>
        <a href="../machi/">待ち牌</a>
        <a href="../practice/">練習</a>
        <a href="../settings/">設定</a>
      </nav>
    </div>
  </header>

  <main class="inner">
    <section id="view-calc">
      <h1>麻雀の点数計算機</h1>
      <div class="card">
        <div class="machi-top"><span id="calc-count"></span><button type="button" class="link-button" id="calc-clear">全部消す</button></div>
        <div class="hand machi-hand" id="calc-hand"></div>
        <div class="melds" id="calc-melds" hidden></div>
      </div>
      <div class="seg wide mode-seg" id="calc-mode"></div>
      <div class="palette" id="calc-palette"></div>
      <div class="card calc-opts" id="calc-opts"></div>
      <div class="card" id="calc-result" aria-live="polite"></div>
      <p class="note">最後に入れた牌が和了牌になります。鳴きは「ポン」などを選んでから牌をタップ（チーは一番小さい牌）。</p>
      <p class="note about">和了した手牌を入れると、役と符の内訳、点数をその場で表示する計算機です。</p>
    </section>
  </main>

  <footer class="site-footer"><div class="inner">© 麻雀ドリル</div></footer>

  <script src="../js/engine.js"></script>
  <script src="../js/generator.js"></script>
  <script src="../js/shanten.js"></script>
  <script src="../js/rules.js"></script>
  <script src="../js/tiles.js"></script>
  <script src="../js/yaku.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
