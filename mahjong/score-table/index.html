<body data-view="table">
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="../">麻雀ドリル</a>
      <nav class="tabs" aria-label="機能">

  <main class="inner">
    <section id="view-table">
      <h1>麻雀の点数表</h1>

        <button type="button" id="table-child" data-side="child" aria-pressed="true">子</button>
        <button type="button" id="table-dealer" data-side="dealer" aria-pressed="false">親</button>
      </div>
      <p class="note">上がロン、下がツモ。<span id="table-rule"></span></p>
      <div id="table-body"></div>
      <p class="note about">符と翻から点数を引ける早見表です。20符はツモの平和だけ、25符は七対子だけで現れます。</p>
