<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>麻雀の点数計算 練習問題（無料・解説つき）｜麻雀ドリル</title>
  <meta name="description" content="麻雀の点数計算を4択で練習できます。翻と符から答える問題と、手牌から役・符を数える問題。役と符の内訳つきで何問でも無料。">
  <link rel="canonical" href="https://yasugi-ryuhei.github.io/mahjong/practice/">
  <meta property="og:title" content="麻雀の点数計算 練習問題（無料・解説つき）｜麻雀ドリル">
  <meta property="og:description" content="麻雀の点数計算を4択で練習できます。翻と符から答える問題と、手牌から役・符を数える問題。役と符の内訳つきで何問でも無料。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yasugi-ryuhei.github.io/mahjong/practice/">
  <meta property="og:site_name" content="麻雀ドリル">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-view="practice" data-players="4">
  <header class="site-header">
    <div class="inner">
      <div class="brand">
        <a class="logo" href="../">麻雀ドリル</a>
        <div class="mode-switch" aria-label="人数">
          <a href="../practice/" aria-current="true">四麻</a>
          <a href="../sanma/practice/">三麻</a>
        </div>
      </div>
      <nav class="tabs" aria-label="機能">
        <a href="../">役一覧</a>
        <a href="../score-table/">点数表</a>
        <a href="../calculator/">計算機</a>
        <a href="../machi/">待ち牌</a>
        <a href="../practice/" aria-current="page">練習</a>
        <a href="../settings/">設定</a>
      </nav>
    </div>
  </header>

  <main class="inner">
    <section id="view-practice">
      <div id="home">
        <h1>麻雀の点数計算の練習</h1>
        <div class="modes">
          <button type="button" class="mode" data-start="table">
            <span class="mode-art"><b>30</b>符<b>3</b>翻</span>
            <span class="mode-text"><strong>翻と符から</strong><small id="stat-table"></small></span>
          </button>
          <button type="button" class="mode" data-start="hand">
            <span class="mode-art tiles-art" id="art-hand"></span>
            <span class="mode-text"><strong>手牌から</strong><small id="stat-hand"></small></span>
          </button>
        </div>
        <a class="rule-bar" href="../settings/"><span id="rule-summary"></span><i>変更</i></a>
      </div>

      <div id="quiz" hidden>
        <div class="quiz-head">
          <button type="button" class="link-button" data-home>← 戻る</button>
          <p id="progress" aria-live="polite"></p>
        </div>
        <div class="card">
          <div id="question"></div>
          <div id="options" class="options"></div>
          <div id="result" aria-live="polite" hidden></div>
        </div>
      </div>
      <p class="note about">問題は毎回自動で作られます。成績はこの端末に保存され、登録は不要です。</p>
    </section>
  </main>

  <footer class="site-footer"><div class="inner">© 麻雀ドリル</div></footer>

  <script src="../js/engine.js"></script>
  <script src="../js/generator.js"></script>
  <script src="../js/shanten.js"></script>
  <script src="../js/rules.js"></script>
  <script src="../js/tiles.js"></script>
  <script src="../js/yaku.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
