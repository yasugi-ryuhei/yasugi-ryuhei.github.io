<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>麻雀の点数早見表（子・親／ロン・ツモ）｜麻雀ドリル</title>
  <meta name="description" content="麻雀の点数早見表です。子と親それぞれについて、20符から110符・1翻から4翻のロンとツモの点数と、満貫以上の点数を一覧で確認できます。">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="inner">
      <a class="logo" href="./">麻雀ドリル</a>
      <nav><a href="./">点数計算の練習</a></nav>
    </div>
  </header>

  <main class="inner">
    <h1>麻雀の点数早見表</h1>
    <p class="lead">上の数字がロンの点数、下の小さい数字がツモの支払いです。子のツモは「子の支払い-親の支払い」、親のツモは全員が同じ額を払います。</p>

    <h2>子の点数</h2>
    <div class="table-wrap"><table class="score" id="table-child"></table></div>
    <h2>親の点数</h2>
    <div class="table-wrap"><table class="score" id="table-dealer"></table></div>
    <h2>満貫以上</h2>
    <div class="table-wrap"><table class="score" id="table-limit"></table></div>

    <p class="note">20符はツモの平和だけ、25符は七対子だけで現れます。切り上げ満貫（30符4翻・60符3翻を満貫にする）は採用していない表です。</p>
    <p><a href="./">点数計算の練習問題を解く</a></p>
  </main>

  <footer class="site-footer"><div class="inner">© 麻雀ドリル</div></footer>

  <script src="js/engine.js"></script>
  <script>
    (function () {
      var E = window.MJEngine;
      var FUS = [20, 25, 30, 40, 50, 60, 70, 80, 90, 100, 110];
      function cell(han, fu, dealer) {
        var ronOk = !(fu === 20) && !(fu === 25 && han < 2);
        var tsumoOk = !(fu === 20 && han < 2) && !(fu === 25 && han < 3);
        if (!ronOk && !tsumoOk) return '<td class="na">-</td>';
        var ron = E.calcScore(han, fu, dealer, false), tsumo = E.calcScore(han, fu, dealer, true);
        var mark = ron.limit ? '満貫 ' : '';
        return '<td>' + (ronOk ? mark + ron.text : '-') + '<small>' + (tsumoOk ? tsumo.text : '-') + '</small></td>';
      }
      function build(id, dealer) {
        var html = '<thead><tr><th>符</th><th>1翻</th><th>2翻</th><th>3翻</th><th>4翻</th></tr></thead><tbody>';
        FUS.forEach(function (fu) {
          html += '<tr><th>' + fu + '符</th>';
          for (var han = 1; han <= 4; han++) html += cell(han, fu, dealer);
          html += '</tr>';
        });
        document.getElementById(id).innerHTML = html + '</tbody>';
      }
      build('table-child', false);
      build('table-dealer', true);
      var rows = [['満貫', '5翻', 5], ['跳満', '6〜7翻', 6], ['倍満', '8〜10翻', 8], ['三倍満', '11〜12翻', 11], ['役満', '13翻以上・役満', 13]];
      var html = '<thead><tr><th></th><th>翻</th><th>子ロン</th><th>子ツモ</th><th>親ロン</th><th>親ツモ</th></tr></thead><tbody>';
      rows.forEach(function (r) {
        html += '<tr><th>' + r[0] + '</th><td>' + r[1] + '</td><td>' + E.calcScore(r[2], 30, false, false).text +
          '</td><td>' + E.calcScore(r[2], 30, false, true).text + '</td><td>' + E.calcScore(r[2], 30, true, false).text +
          '</td><td>' + E.calcScore(r[2], 30, true, true).text + '</td></tr>';
      });
      document.getElementById('table-limit').innerHTML = html + '</tbody>';
    })();
  </script>
</body>
</html>
