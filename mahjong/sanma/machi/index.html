  <meta name="description" content="三人麻雀（サンマ）の手牌を入れると、待ち牌と残り枚数、何を切ると受け入れが何種何枚になるかを自動で計算します。">
  <link rel="canonical" href="https://yasugi-ryuhei.github.io/mahjong/sanma/machi/">
  <meta property="og:title" content="三人麻雀（サンマ）の待ち牌チェック・何切るツール｜麻雀ドリル">
  <meta property="og:description" content="三人麻雀（サンマ）の手牌を入れると、待ち牌と残り枚数、何を切ると受け入れが何種何枚になるかを自動で計算します。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yasugi-ryuhei.github.io/mahjong/sanma/machi/">
  <meta property="og:site_name" content="麻雀ドリル">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-view="machi" data-players="3">
  <header class="site-header">
    <div class="inner">
      <div class="brand">
        <a class="logo" href="../../sanma/">麻雀ドリル</a>
        <div class="mode-switch" aria-label="人数">
          <a href="../../machi/">四麻</a>
          <a href="../../sanma/machi/" aria-current="true">三麻</a>
        </div>
      </div>
      <nav class="tabs" aria-label="機能">
        <a href="../../sanma/">役一覧</a>
        <a href="../../sanma/score-table/">点数表</a>
        <a href="../../sanma/calculator/">計算機</a>
        <a href="../../sanma/machi/" aria-current="page">待ち牌</a>
        <a href="../../sanma/practice/">練習</a>
        <a href="../../sanma/settings/">設定</a>
      </nav>
    </div>
  </header>

  <main class="inner">
    <section id="view-machi">
      <h1>三人麻雀の待ち牌チェック</h1>
      <div class="card">
        <div class="machi-top"><span id="machi-count"></span><button type="button" class="link-button" id="machi-clear">全部消す</button></div>
        <div class="hand machi-hand" id="machi-hand"></div>
      </div>
      <div class="palette" id="palette"></div>
      <div class="card" id="machi-result" aria-live="polite"></div>
      <p class="note">13枚で待ち、14枚で何を切るかが出ます。鳴いた面子は入れずに、残りの手牌だけ入れてください。</p>
      <p class="note about">二萬〜八萬を除いた三人麻雀の牌で、待ち牌と受け入れ枚数を計算します。</p>
    </section>
  </main>

  <footer class="site-footer"><div class="inner">© 麻雀ドリル</div></footer>
