<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>三人麻雀（サンマ）の点数計算機｜北抜き・ツモ損・1000点単位に対応｜麻雀ドリル</title>
  <meta name="description" content="三人麻雀（サンマ）専用の点数計算機です。北抜きドラ、ツモ損あり・なし、1000点単位の丸め方を選んで、役・符・点数を自動で計算します。">
  <link rel="canonical" href="https://yasugi-ryuhei.github.io/mahjong/sanma/calculator/">
  <meta property="og:title" content="三人麻雀（サンマ）の点数計算機｜北抜き・ツモ損・1000点単位に対応｜麻雀ドリル">
  <meta property="og:description" content="三人麻雀（サンマ）専用の点数計算機です。北抜きドラ、ツモ損あり・なし、1000点単位の丸め方を選んで、役・符・点数を自動で計算します。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yasugi-ryuhei.github.io/mahjong/sanma/calculator/">
  <meta property="og:site_name" content="麻雀ドリル">
  <link rel="stylesheet" href="../../css/style.css">
</head>
<body data-view="calc" data-players="3">
  <header class="site-header">
    <div class="inner">
      <div class="brand">
        <a class="logo" href="../../sanma/">麻雀ドリル</a>
        <div class="mode-switch" aria-label="人数">
          <a href="../../calculator/">四麻</a>
          <a href="../../sanma/calculator/" aria-current="true">三麻</a>
        </div>
      </div>
      <nav class="tabs" aria-label="機能">
        <a href="../../sanma/">役一覧</a>
        <a href="../../sanma/score-table/">点数表</a>
        <a href="../../sanma/calculator/" aria-current="page">計算機</a>
        <a href="../../sanma/machi/">待ち牌</a>
        <a href="../../sanma/practice/">練習</a>
        <a href="../../sanma/settings/">設定</a>
      </nav>
    </div>
  </header>

  <main class="inner">
    <section id="view-calc">
      <h1>三人麻雀の点数計算機</h1>
      <div class="card">
        <div class="machi-top"><span id="calc-count"></span><button type="button" class="link-button" id="calc-clear">全部消す</button></div>
        <div class="hand machi-hand" id="calc-hand"></div>
        <div class="melds" id="calc-melds" hidden></div>
      </div>
      <div class="seg wide mode-seg" id="calc-mode"></div>
      <div class="palette" id="calc-palette"></div>
      <div class="card calc-opts" id="calc-opts"></div>
      <div class="card" id="calc-result" aria-live="polite"></div>
      <p class="note">最後に入れた牌が和了牌になります。鳴きは「ポン」などを選んでから牌をタップ（チーは一番小さい牌）。</p>
      <p class="note about">北抜きドラの枚数、ツモ損の有無、点数の丸め方を自分の卓のルールに合わせて計算できます。</p>
    </section>
  </main>

  <footer class="site-footer"><div class="inner">© 麻雀ドリル</div></footer>

  <script src="../../js/engine.js"></script>
  <script src="../../js/generator.js"></script>
  <script src="../../js/shanten.js"></script>
  <script src="../../js/rules.js"></script>
  <script src="../../js/tiles.js"></script>
  <script src="../../js/yaku.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
