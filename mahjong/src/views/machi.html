      <h1>麻雀の待ち牌チェック</h1>
      <div class="card">
        <div class="machi-top"><span id="machi-count"></span><button type="button" class="link-button" id="machi-clear">全部消す</button></div>
        <div class="hand machi-hand" id="machi-hand"></div>
      </div>
      <div class="palette" id="palette"></div>
      <div class="card" id="machi-result" aria-live="polite"></div>
      <p class="note">13枚で待ち、14枚で何を切るかが出ます。鳴いた面子は入れずに、残りの手牌だけ入れてください。</p>
