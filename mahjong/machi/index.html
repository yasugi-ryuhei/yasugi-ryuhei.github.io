<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>麻雀の待ち牌チェック・何切るツール｜受け入れ枚数を自動計算｜麻雀ドリル</title>
  <meta name="description" content="手牌を入れると、待ち牌と残り枚数、何を切ると受け入れが何種何枚になるかを自動で計算します。シャンテン数も表示。">
  <link rel="canonical" href="https://yasugi-ryuhei.github.io/mahjong/machi/">
  <meta property="og:title" content="麻雀の待ち牌チェック・何切るツール｜受け入れ枚数を自動計算｜麻雀ドリル">
  <meta property="og:description" content="手牌を入れると、待ち牌と残り枚数、何を切ると受け入れが何種何枚になるかを自動で計算します。シャンテン数も表示。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://yasugi-ryuhei.github.io/mahjong/machi/">
  <meta property="og:site_name" content="麻雀ドリル">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body data-view="machi" data-players="4">
  <header class="site-header">
    <div class="inner">
      <div class="brand">
        <a class="logo" href="../">麻雀ドリル</a>
        <div class="mode-switch" aria-label="人数">
          <a href="../machi/" aria-current="true">四麻</a>
          <a href="../sanma/machi/">三麻</a>
        </div>
      </div>
      <nav class="tabs" aria-label="機能">
        <a href="../">役一覧</a>
        <a href="../score-table/">点数表</a>
        <a href="../calculator/">計算機</a>
        <a href="../machi/" aria-current="page">待ち牌</a>
        <a href="../practice/">練習</a>
        <a href="../settings/">設定</a>
      </nav>
    </div>
  </header>

  <main class="inner">
    <section id="view-machi">
      <h1>麻雀の待ち牌チェック</h1>
      <div class="card">
        <div class="machi-top"><span id="machi-count"></span><button type="button" class="link-button" id="machi-clear">全部消す</button></div>
        <div class="hand machi-hand" id="machi-hand"></div>
      </div>
      <div class="palette" id="palette"></div>
      <div class="card" id="machi-result" aria-live="polite"></div>
      <p class="note">13枚で待ち、14枚で何を切るかが出ます。鳴いた面子は入れずに、残りの手牌だけ入れてください。</p>
      <p class="note about">手牌の待ち牌、シャンテン数、切る牌ごとの受け入れ枚数を調べられるツールです。</p>
    </section>
  </main>

  <footer class="site-footer"><div class="inner">© 麻雀ドリル</div></footer>

  <script src="../js/engine.js"></script>
  <script src="../js/generator.js"></script>

  <script src="../js/rules.js"></script>

  <script src="../js/yaku.js"></script>
  <script src="../js/app.js"></script>
</body>
</html>
